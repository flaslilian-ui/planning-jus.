<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma semaine jus & repas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F4;--card:#fff;--ink:#111;--mut:#666;--line:#E2E2DE;--acc:#111;--on:#fff;--soft:#EEEEEA;--star:#E9A21B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--card:#1A1A1A;--ink:#F2F2F2;--mut:#A0A0A0;--line:#2E2E2E;--acc:#F2F2F2;--on:#111;--soft:#262626}}
:root[data-theme="dark"]{--bg:#101010;--card:#1A1A1A;--ink:#F2F2F2;--mut:#A0A0A0;--line:#2E2E2E;--acc:#F2F2F2;--on:#111;--soft:#262626}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.15}
main{max-width:1240px;margin:0 auto;padding:48px 28px 90px}
header{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:end;margin-bottom:44px}
h1{font-size:clamp(32px,5vw,52px)}
header p{margin:10px 0 0;color:var(--mut);max-width:48ch}
.tabs{display:flex;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px}
.tabs button{border:0;background:none;color:var(--ink);font:500 15px 'DM Sans';padding:12px 24px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--on)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:18px;overflow-x:auto;padding-bottom:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.day h3{font-size:20px}
.slot{border:1px solid transparent;text-align:left;background:var(--soft);color:var(--ink);border-radius:12px;padding:14px;font:15px/1.4 'DM Sans';cursor:pointer}
.slot small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:4px}
.slot:hover,.slot[aria-pressed=true]{border-color:var(--acc)}
.panel{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:none}
.panel.on{display:block}
.panel h2{font-size:30px}
.panel .tag{color:var(--mut);margin:6px 0 24px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px}
.panel h4{margin:0 0 10px;font-size:16px}
.panel ul,.panel ol{margin:0;padding-left:20px}.panel li{margin-bottom:6px}
.benefit{background:var(--soft);border-radius:12px;padding:16px 18px;margin-bottom:26px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:26px;color:var(--line);cursor:pointer;padding:0 1px}
.stars button.f{color:var(--star)}
.rate span{display:block;color:var(--mut);font-size:13px}
.bot{margin-top:56px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px}
.bot h2{font-size:26px}.bot p{color:var(--mut);margin:6px 0 20px}
#log{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.msg{padding:12px 16px;border-radius:14px;max-width:70ch;background:var(--soft)}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--on)}
.row{display:flex;gap:12px;flex-wrap:wrap}
textarea{flex:1;min-width:240px;border:1px solid var(--line);border-radius:12px;padding:14px;font:16px 'DM Sans';background:var(--bg);color:var(--ink);resize:vertical;min-height:56px}
.go{border:0;background:var(--acc);color:var(--on);font:500 15px 'DM Sans';padding:0 28px;border-radius:12px;cursor:pointer;min-height:56px}
.go:disabled{opacity:.5}
.sugg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sugg button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 16px;font:14px 'DM Sans';cursor:pointer}
.reset{margin-top:36px;border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;font:14px 'DM Sans'}
</style>
</head>
<body>
<main>
<header>
 <div><h1>Ma semaine jus & repas</h1><p id="sub"></p></div>
 <div class="tabs" role="group" aria-label="Objectif"><button data-g="muscle" aria-pressed="true">Musculaire</button><button data-g="aesthetic" aria-pressed="false">Esthétique</button></div>
</header>
<div class="week" id="week"></div>
<section class="panel" id="panel" aria-live="polite"></section>
<section class="bot" id="bot">
 <h2>Mon assistant</h2>
 <p>Écris ce que tu veux changer ou demander, il adapte ton planning. Exemple : « remplace le jus de mardi, je n'aime pas la betterave ».</p>
 <div class="sugg" id="sugg"></div>
 <div id="log"></div>
 <div class="row"><textarea id="txt" placeholder="Écris ta demande ici" aria-label="Ta demande"></textarea><button class="go" id="send">Envoyer</button></div>
</section>
<button class="reset" id="reset">Remettre le planning de départ</button>
</main>
<script>
const D=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const SUB={muscle:"Objectif musculaire : protéines, énergie et récupération, chaque jour.",aesthetic:"Objectif esthétique : peau plus belle, moins de rétention d'eau."};
const J={muscle:[
["Jus récupération betterave","1 betterave cuite, 2 oranges, 1 pomme, 1 cm de gingembre","Presse ou mixe tout, filtre si tu veux.","Les nitrates de la betterave aident l'effort et la récupération. La vitamine C de l'orange soutient les défenses."],
["Smoothie banane protéiné","1 banane, 250 ml de lait, 40 g de flocons d'avoine, 1 c. à soupe de beurre de cacahuète, 1 c. à café de cannelle","Mixe 1 minute.","Glucides et protéines pour nourrir le muscle dès le réveil."],
["Vert énergie épinard-kiwi","1 poignée d'épinards, 2 kiwis, 1 pomme verte, ½ citron","Centrifuge ou mixe avec un peu d'eau.","Très riche en vitamine C et en magnésium, utile contre la fatigue et les crampes."],
["Carotte-orange-curcuma","3 carottes, 2 oranges, ½ c. à café de curcuma, 1 pincée de poivre","Presse, ajoute le curcuma et le poivre.","Anti-inflammatoire, utile après l'entraînement. Le poivre aide à absorber le curcuma."],
["Smoothie myrtilles-yaourt","1 poignée de myrtilles, 1 yaourt grec, 1 c. à café de miel, 100 ml de lait","Mixe jusqu'à texture lisse.","Antioxydants des myrtilles et protéines du yaourt grec pour la récupération."],
["Ananas-gingembre","¼ d'ananas, 1 cm de gingembre, ½ citron vert","Presse le tout.","La bromélaïne de l'ananas aide la digestion des protéines. Gingembre contre les courbatures."],
["Mangue-avoine énergie","1 mangue, 30 g d'avoine, 200 ml de lait d'amande, 2 dattes","Mixe 1 minute.","Énergie durable grâce aux fibres de l'avoine et aux glucides de la mangue."]],
aesthetic:[
["Concombre-pomme-persil drainant","½ concombre, 1 pomme verte, 1 poignée de persil, ½ citron","Centrifuge, bois frais.","Hydratant et drainant, il aide contre la rétention d'eau et le teint fatigué."],
["Éclat carotte-orange","3 carottes, 2 oranges, ½ citron, 1 c. à café d'huile de colza","Presse, ajoute l'huile en dernier.","Le bêta-carotène donne un teint éclatant. L'huile aide à l'absorber."],
["Ananas-menthe anti-rétention","¼ d'ananas, 8 feuilles de menthe, ¼ concombre","Presse ou mixe avec de la glace.","Diurétique naturel, riche en vitamine C pour le collagène de la peau."],
["Vert détox céleri-kiwi","2 branches de céleri, 2 kiwis, 1 pomme, 1 cm de gingembre","Centrifuge le tout.","Le céleri aide à éliminer l'eau en trop, le kiwi apporte de la vitamine C pour la clarté du teint."],
["Fraise-framboise glow","1 poignée de fraises, 1 poignée de framboises, 1 orange, 150 ml d'eau de coco","Mixe 1 minute.","Vitamine C et polyphénols qui protègent la peau et soutiennent le collagène."],
["Papaye-citron peau douce","½ papaye, ½ citron vert, 200 ml d'eau de coco","Mixe jusqu'à lisse.","Vitamines A et C, douceur pour une peau sèche. L'eau de coco hydrate."],
["Betterave-pomme-carotte","1 betterave cuite, 1 pomme, 2 carottes, ½ citron","Presse ou mixe puis filtre.","Aide la circulation et illumine un teint terne."]]};
const M={muscle:[
[["Poulet, riz complet, brocoli","150 g de poulet, 80 g de riz complet, 150 g de brocoli, huile d'olive","Protéines maigres et glucides lents pour construire le muscle."],["Quinoa, saumon, haricots verts","120 g de saumon, 70 g de quinoa, 150 g de haricots verts, citron","Oméga-3 anti-inflammatoires et protéines complètes pour la récupération."]],
[["Omelette 3 œufs, patate douce","3 œufs, 200 g de patate douce, ciboulette","Protéines complètes et glucides à index modéré pour l'énergie."],["Bœuf haché, lentilles, salade","125 g de bœuf 5 %, 100 g de lentilles cuites, salade, vinaigrette","Fer et zinc du bœuf, fibres et protéines des lentilles."]],
[["Thon, pâtes complètes, courgettes","1 boîte de thon, 80 g de pâtes complètes, 1 courgette, tomates","Protéines maigres et glucides pour refaire le plein d'énergie."],["Dinde, boulgour, poivrons","150 g de dinde, 70 g de boulgour, 2 poivrons","Très riche en protéines et en vitamine C."]],
[["Bowl pois chiches, œufs, avocat","150 g de pois chiches, 2 œufs durs, ½ avocat, citron","Protéines, fibres et bons lipides pour la satiété."],["Cabillaud, riz, épinards","150 g de cabillaud, 80 g de riz, 100 g d'épinards","Poisson maigre et digeste, magnésium des épinards pour les muscles."]],
[["Poulet, quinoa, carottes","150 g de poulet, 70 g de quinoa, 2 carottes, cumin","Protéines complètes et bêta-carotène."],["Tofu sauté, nouilles, légumes","150 g de tofu, nouilles de riz, poivron, chou, sauce soja","Protéines végétales pour varier les sources."]],
[["Steak, pommes de terre, haricots","150 g de steak, 250 g de pommes de terre, haricots verts","Fer, créatine naturelle et glucides de récupération."],["Crevettes, riz, petits pois","150 g de crevettes, 80 g de riz, 100 g de petits pois, ail","Protéines très maigres et iode."]],
[["Saumon, patate douce, brocoli","150 g de saumon, 200 g de patate douce, brocoli","Oméga-3 et glucides pour bien finir la semaine."],["Omelette, pain complet, salade","3 œufs, 2 tranches de pain complet, salade","Repas léger et riche en protéines pour le soir."]]],
aesthetic:[
[["Salade concombre, feta, olives","1 concombre, 60 g de feta, olives, huile d'olive, menthe","Hydratant et drainant, bons lipides de l'huile d'olive."],["Saumon, courgettes, quinoa","120 g de saumon, 1 courgette, 70 g de quinoa","Oméga-3 qui nourrissent une peau sèche."]],
[["Poulet, avocat, salade verte","130 g de poulet, ½ avocat, salade, citron","Vitamine E de l'avocat pour la barrière de la peau."],["Soupe carottes-gingembre","4 carottes, 1 cm de gingembre, 1 oignon, bouillon","Bêta-carotène pour l'éclat, gingembre anti-inflammatoire."]],
[["Maquereau, patate douce, épinards","1 filet de maquereau, 200 g de patate douce, épinards","Oméga-3 et vitamine A pour réparer la peau."],["Omelette aux herbes, salade","3 œufs, persil, ciboulette, salade","Protéines et zinc contre les impuretés."]],
[["Bowl lentilles, noix, betterave","100 g de lentilles, 1 betterave cuite, 6 noix, vinaigrette","Zinc, fer et oméga-3 végétaux. La betterave aide le teint."],["Cabillaud, brocoli, riz","150 g de cabillaud, brocoli, 70 g de riz","Léger et peu salé, bon contre la rétention d'eau."]],
[["Sardines, tomates, pain complet","1 boîte de sardines, 2 tomates, 2 tranches de pain complet","Oméga-3, vitamine D et lycopène qui protège la peau."],["Poulet, courgettes, persil","130 g de poulet, 2 courgettes, persil","Peu de sel, persil drainant."]],
[["Salade pois chiches, concombre","150 g de pois chiches, 1 concombre, tomates, citron, cumin","Fibres et zinc, hydratant."],["Saumon, asperges, citron","120 g de saumon, 8 asperges, citron","Asperges drainantes, saumon nourrissant pour la peau."]],
[["Œufs, avocat, tomates","2 œufs, ½ avocat, 2 tomates","Biotine des œufs et bons lipides pour une peau douce."],["Soupe de légumes verts","courgette, poireau, épinards, bouillon","Légère, hydratante et riche en vitamines."]]]};
const STEPS="Cuis la source de protéines (poêle, four ou eau). Cuis la base (riz, quinoa, pâtes, patate douce) selon le paquet. Ajoute les légumes, un filet d'huile d'olive, sel, poivre et citron.";
const base=()=>{const o={};for(const g of["muscle","aesthetic"])o[g]=D.map((_,i)=>({j:{n:J[g][i][0],ing:J[g][i][1],st:J[g][i][2],b:J[g][i][3]},m:{n:M[g][i][0][0],ing:M[g][i][0][1],st:STEPS,b:M[g][i][0][2]},s:{n:M[g][i][1][0],ing:M[g][i][1][1],st:STEPS,b:M[g][i][1][2]}}));return o};
let PL=base(),goal="muscle",R={};
try{const s=localStorage.getItem("pl3");if(s)PL=JSON.parse(s);R=JSON.parse(localStorage.getItem("rt3")||"{}")}catch(e){}
const persist=()=>{try{localStorage.setItem("pl3",JSON.stringify(PL))}catch(e){}};
const q=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LB={j:"Jus du matin",m:"Midi",s:"Soir"};
function render(){
 document.documentElement.dataset.goal=goal;q("#sub").textContent=SUB[goal];
 q("#week").innerHTML=D.map((d,i)=>`<div class="day"><h3>${d}</h3>${["j","m","s"].map(k=>`<button class="slot" data-i="${i}" data-k="${k}"><small>${LB[k]}</small>${esc(PL[goal][i][k].n)}</button>`).join("")}</div>`).join("");
}
const stars=(v,id)=>`<span class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${id}" data-v="${n}" class="${n<=v?"f":""}" aria-label="${n} étoile${n>1?"s":""}">★</button>`).join("")}</span>`;
function open(i,k){
 const it=PL[goal][i][k],id=goal+i+k;
 document.querySelectorAll(".slot").forEach(b=>b.setAttribute("aria-pressed",b.dataset.i==i&&b.dataset.k==k));
 const p=q("#panel");
 p.innerHTML=`<h2>${esc(it.n)}</h2><p class="tag">${D[i]}, ${LB[k].toLowerCase()}</p><div class="benefit"><h4>Ses bienfaits</h4>${esc(it.b)}</div><div class="cols"><div><h4>Ingrédients</h4><ul>${String(it.ing).split(", ").map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><h4>Préparation</h4><p>${esc(it.st)}</p></div><div class="rate"><span>Ma note</span>${stars(R[id]||0,id)}</div></div>`;
 p.classList.add("on");p.scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-g]");if(g){goal=g.dataset.g;document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",b==g));q("#panel").classList.remove("on");render();return}
 const s=e.target.closest(".slot");if(s){open(+s.dataset.i,s.dataset.k);return}
 const r=e.target.closest("[data-r]");if(r){const v=+r.dataset.v;R[r.dataset.r]=v;try{localStorage.setItem("rt3",JSON.stringify(R))}catch(x){}r.parentElement.querySelectorAll("button").forEach((b,n)=>b.classList.toggle("f",n<v))}
});
q("#reset").onclick=()=>{PL=base();persist();q("#panel").classList.remove("on");render();say("Planning remis au départ.")};
function say(t,me){const d=document.createElement("div");d.className="msg"+(me?" me":"");d.textContent=t;q("#log").appendChild(d);return d}
["Remplace le jus de mardi par un jus sans gingembre","Je veux des repas végétariens toute la semaine","Plus de protéines au petit-déjeuner","Des repas plus rapides à faire"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{q("#txt").value=t;ask()};q("#sugg").appendChild(b)});
q("#send").onclick=ask;
q("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
let busy=false;
async function ask(){
 const t=q("#txt").value.trim();if(!t||busy)return;busy=true;q("#send").disabled=true;say(t,1);q("#txt").value="";
 const wait=say("Je réfléchis…");
 try{
  const sample=await claude.use("sample");
  if(!sample){wait.textContent="L'assistant n'est pas disponible dans cette vue. Ouvre la page depuis ton compte Claude.";return}
  const cur=PL[goal].map((d,i)=>({day:i,nom_jour:D[i],j:d.j.n,m:d.m.n,s:d.s.n}));
  const prompt=`Tu es l'assistant nutrition d'une appli de planning de jus et de repas, en français. Objectif actuel : ${goal==="muscle"?"musculaire (protéines, énergie, récupération)":"esthétique (peau sèche et abîmée, impuretés, rétention d'eau)"}. Planning actuel : ${JSON.stringify(cur)}. Demande de l'utilisateur : "${t}". Réponds UNIQUEMENT avec un JSON : {"reply":"réponse courte et chaleureuse","changes":[{"day":0 à 6 (0=lundi),"slot":"j" (jus matin) ou "m" (midi) ou "s" (soir),"n":"nom","ing":"ingrédients avec quantités séparés par des virgules","st":"préparation simple en 1 à 3 phrases","b":"bienfaits en 1 à 2 phrases"}]}. Si la demande est une simple question, mets changes à []. Recettes simples, variées, sans produit rare. Pas de conseil médical.`;
  const r=await sample.json(prompt,{cache:false});
  let n=0;
  for(const c of (r.changes||[])){if(c&&PL[goal][c.day]&&PL[goal][c.day][c.slot]&&c.n){PL[goal][c.day][c.slot]={n:String(c.n),ing:String(c.ing||""),st:String(c.st||""),b:String(c.b||"")};n++}}
  if(n){persist();render();q("#panel").classList.remove("on")}
  wait.textContent=(r.reply||"C'est fait.")+(n?` (${n} case${n>1?"s":""} modifiée${n>1?"s":""} dans le planning ${goal==="muscle"?"musculaire":"esthétique"})`:"");
 }catch(err){wait.textContent=err&&err.code==="not_granted"?"Autorise l'assistant pour l'utiliser.":"L'assistant n'a pas pu répondre, réessaie dans un instant."}
 finally{busy=false;q("#send").disabled=false}
}
render();
</script>
</body>
</html>
